<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMU Badminton - Booking</title>
    <style>
        /* CSS 变量 - 主题配色 (SaaS风格优化) */
        :root {
            --primary: #2563EB;
            --primary-hover: #1D4ED8;
            --success: #10B981;
            --success-hover: #059669;
            --danger: #EF4444;
            --danger-hover: #DC2626;
            --warning: #F59E0B;
            --bg-primary: #F8FAFC;
            --bg-secondary: #FFFFFF;
            --bg-hover: #F1F5F9;
            --text-primary: #0F172A;
            --text-secondary: #64748B;
            --text-muted: #94A3B8;
            --border: #E2E8F0;
            --border-focus: #93C5FD;
            --shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            --radius: 12px;
            --radius-btn: 8px;
            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* 暗色主题 */
        [data-theme="dark"] {
            --primary: #3B82F6;
            --primary-hover: #60A5FA;
            --bg-primary: #0F172A;
            --bg-secondary: #1E293B;
            --bg-hover: #334155;
            --text-primary: #F8FAFC;
            --text-secondary: #94A3B8;
            --border: #334155;
            --border-focus: #3B82F6;
            --shadow: 0 1px 2px 0 rgb(0 0 0 / 0.3);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.4);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            transition: background var(--transition), color var(--transition);
            font-size: 14px;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* 容器 */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 32px 24px;
        }

        /* 头部 */
        .header {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 32px;
            padding: 24px 32px;
            background: var(--bg-secondary);
            border-radius: var(--radius);
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border);
            transition: box-shadow var(--transition);
        }

        .header:hover {
            box-shadow: var(--shadow-lg);
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .header-title-row {
            padding-bottom: 20px;
            border-bottom: 1px dashed var(--border);
        }

        .header-tools-row {
            flex-wrap: wrap;
            gap: 16px;
            justify-content: space-between;
            padding-top: 8px;
        }

        .header-right {
            margin-left: auto;
            display: flex;
            align-items: flex-start;
            gap: 14px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
        }

        .logo::before {
            content: "🏸";
            font-size: 28px;
            margin-right: 12px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 24px;
            flex-wrap: wrap;
        }

        .header-left > * {
            position: relative;
        }

        .header-left > *:not(:last-child)::after {
            content: '';
            position: absolute;
            right: -12px;
            top: 50%;
            transform: translateY(-50%);
            height: 20px;
            width: 1px;
            background: var(--border);
        }

        .user-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 130px;
            height: 38px;
            padding: 0 16px;
            background: rgba(37, 99, 235, 0.1);
            border: 1px solid rgba(37, 99, 235, 0.3);
            border-radius: var(--radius-btn);
            font-size: 13px;
            font-weight: 600;
            color: var(--primary);
            letter-spacing: 0.5px;
            white-space: nowrap;
            transition: all var(--transition);
        }
        .user-badge::before {
            content: "👤";
            margin-right: 6px;
            font-size: 14px;
        }
        [data-theme="dark"] .user-badge {
            background: rgba(59, 130, 246, 0.15);
            border-color: rgba(59, 130, 246, 0.4);
        }

        /* 表单控件 */
        .form-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .form-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            white-space: nowrap;
        }

        .form-input {
            padding: 8px 14px;
            height: 38px;
            border: 1px solid var(--border);
            border-radius: var(--radius-btn);
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 14px;
            font-weight: 500;
            transition: all var(--transition);
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.02);
            cursor: pointer;
        }

        .form-input:hover {
            border-color: #CBD5E1;
            background: var(--bg-secondary);
        }
        [data-theme="dark"] .form-input:hover {
            border-color: #475569;
        }

        .form-input:focus {
            outline: none;
            background: var(--bg-secondary);
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        /* 按钮 */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 8px 16px;
            height: 38px;
            border: none;
            border-radius: var(--radius-btn);
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition);
            white-space: nowrap;
            user-select: none;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-primary {
            background: var(--primary);
            color: #FFFFFF;
            box-shadow: 0 1px 2px rgba(37, 99, 235, 0.3);
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
            transform: translateY(-1px);
        }

        .btn-success {
            background: var(--success);
            color: #FFFFFF;
            box-shadow: 0 1px 2px rgba(16, 185, 129, 0.3);
        }

        .btn-success:hover {
            background: var(--success-hover);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
            transform: translateY(-1px);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-primary);
            box-shadow: var(--shadow);
        }

        .btn-outline:hover {
            background: rgba(37, 99, 235, 0.05);
            border-color: var(--primary);
            color: var(--primary);
        }

        .btn-icon {
            width: 38px;
            height: 38px;
            padding: 0;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        /* 开关 */
        .switch-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .switch {
            position: relative;
            width: 44px;
            height: 24px;
            background: var(--border);
            border-radius: 12px;
            cursor: pointer;
            transition: var(--transition);
        }

        .switch::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 50%;
            transition: var(--transition);
        }

        .switch.active {
            background: var(--primary);
        }

        .switch.active::after {
            left: 22px;
        }

        /* 场地地图 (重新设计为悬浮气泡) */
        .court-map-wrapper {
            position: relative;
            display: inline-block;
            margin-left: auto;
        }

        .court-map-toggle {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 6px 12px;
            border-radius: var(--radius-btn);
            background: var(--bg-hover);
            transition: all var(--transition);
            border: 1px solid transparent;
        }

        .court-map-toggle:hover {
            color: var(--primary);
            background: rgba(37, 99, 235, 0.05);
            border-color: rgba(37, 99, 235, 0.2);
        }

        .court-map {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            background: var(--bg-secondary);
            padding: 12px 16px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-lg);
            flex-shrink: 0;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all var(--transition);
            z-index: 100;
        }

        .court-map-wrapper:hover .court-map {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .court-map-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            text-align: center;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px dashed var(--border);
        }

        .court-row {
            display: flex;
            justify-content: center;
            gap: 4px;
            margin-bottom: 4px;
        }

        .court-cell {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-hover);
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-primary);
            transition: all var(--transition);
        }
        
        .court-cell:hover {
            background: rgba(37, 99, 235, 0.1);
            border-color: var(--primary);
            color: var(--primary);
        }

        .court-entrance {
            font-size: 11px;
            color: var(--text-secondary);
            text-align: center;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px dashed var(--border);
        }

        /* 主内容区 */
        .main-content {
            background: var(--bg-secondary);
            border-radius: var(--radius);
            box-shadow: 0 1px 3px var(--shadow);
            overflow: hidden;
        }

        /* 图例 */
        .legend {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 16px 20px;
            background: var(--bg-primary);
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .legend-status {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 14px;
            padding-left: 8px;
        }

        .legend-status .status-item {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .legend-dot {
            width: 16px;
            height: 16px;
            border-radius: 4px;
        }

        .legend-dot.available {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
        }

        .legend-dot.selected {
            background: var(--primary);
        }

        .legend-dot.reserved {
            background: var(--danger);
        }

        .legend-dot.others {
            background: var(--warning);
        }

        /* 表格容器 */
        .table-container {
            overflow-x: auto;
            position: relative;
            background: var(--bg-secondary);
            border-radius: var(--radius);
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border);
            padding-bottom: 2px; /* 留出一点滚动条空间 */
        }

        /* 表格 */
        .schedule-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            min-width: 800px;
        }

        .schedule-table th,
        .schedule-table td {
            padding: 0;
            text-align: center;
            border-right: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
        }

        .schedule-table th:last-child,
        .schedule-table td:last-child {
            border-right: none;
        }

        /* 隐藏掉最后一行的底部边框让卡片边缘更干净 */
        .schedule-table tr:last-child td {
            border-bottom: none;
        }

        .schedule-table thead {
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .schedule-table th {
            padding: 14px 8px;
            background: var(--bg-hover);
            font-size: 14px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: 0.5px;
        }

        .schedule-table th:first-child {
            position: sticky;
            left: 0;
            z-index: 11;
            background: var(--bg-hover);
            box-shadow: 2px 0 4px -2px rgba(0,0,0,0.05);
        }

        .court-label {
            position: sticky;
            left: 0;
            z-index: 5;
            background: var(--bg-secondary);
            padding: 8px 12px !important;
            font-weight: 700;
            font-size: 14px;
            color: var(--text-primary);
            width: 80px;
            min-width: 80px;
            white-space: nowrap;
            box-shadow: 2px 0 4px -2px rgba(0,0,0,0.05);
            transition: background var(--transition);
        }
        
        .schedule-table tr:hover .court-label {
            background: var(--bg-hover);
        }

        /* 时间单元格 */
        .hour-cell {
            width: 70px;
            height: 48px;
            cursor: pointer;
            transition: all var(--transition);
            position: relative;
            background: var(--bg-secondary);
        }

        .hour-cell:hover:not(.reserved):not(.disabled) {
            background: rgba(37, 99, 235, 0.05); /* 更柔和的 hover 色 */
            box-shadow: inset 0 0 0 2px var(--border-focus); /* 内发光选中感而非生硬放大 */
            z-index: 2; /* 确保 box-shadow 不被遮挡 */
        }

        .hour-cell.selected {
            background: var(--primary) !important;
            color: white;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.2);
        }

        .hour-cell.selected::after {
            content: '✓';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 18px;
            font-weight: bold;
        }

        .hour-cell.reserved {
            background: var(--danger) !important;
            color: white;
            cursor: not-allowed;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.2);
        }

        .hour-cell.reserved::after {
            content: '×';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 16px;
        }

        .hour-cell.others {
            background: var(--warning) !important;
            color: white;
            cursor: not-allowed;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.2);
        }

        .hour-cell.others::after {
            content: '⏳';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 14px;
        }

        /* Toast 通知 */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 20px;
            background: var(--bg-secondary);
            border-radius: var(--radius);
            box-shadow: 0 4px 12px var(--shadow);
            animation: slideIn 0.3s ease;
            max-width: 360px;
        }

        .toast.success {
            border-left: 4px solid var(--success);
        }

        .toast.error {
            border-left: 4px solid var(--danger);
        }

        .toast.info {
            border-left: 4px solid var(--primary);
        }

        .toast-icon {
            font-size: 20px;
        }

        .toast-content {
            flex: 1;
        }

        .toast-title {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 2px;
        }

        .toast-message {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .toast-close {
            background: none;
            border: none;
            font-size: 18px;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 4px;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes slideOut {
            from {
                transform: translateX(0);
                opacity: 1;
            }
            to {
                transform: translateX(100%);
                opacity: 0;
            }
        }

        /* 弹窗 */
        dialog {
            border: none;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            padding: 0;
            max-width: 400px;
            width: 90%;
            background: var(--bg-secondary);
            color: var(--text-primary);
            margin: auto;
        }

        dialog[open] {
            position: fixed;
            inset: 0;
            margin: auto;
        }

        dialog::backdrop {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
        }

        .dialog-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
        }

        .dialog-title {
            font-size: 18px;
            font-weight: 600;
        }

        .dialog-body {
            padding: 24px;
        }

        .dialog-info {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .dialog-info-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 14px;
            background: var(--bg-primary);
            border-radius: 6px;
        }

        .dialog-info-label {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .dialog-info-value {
            font-weight: 600;
            font-size: 14px;
        }

        .dialog-footer {
            padding: 16px 24px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        /* 登录弹窗 */
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .login-field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .login-field label {
            font-size: 14px;
            font-weight: 500;
        }

        .login-input-wrapper {
            position: relative;
        }

        .login-input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 14px;
            transition: var(--transition);
        }

        .login-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 13px;
        }

        /* 加载状态 */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* 状态栏 */
        .status-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            background: var(--bg-primary);
            border-top: 1px solid var(--border);
            font-size: 13px;
            color: var(--text-secondary);
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .container {
                padding: 12px;
            }

            .header {
                padding: 16px;
            }

            .header-title-row {
                padding-bottom: 12px;
                flex-wrap: wrap;
                gap: 10px;
            }

            .header-right {
                width: 100%;
                justify-content: space-between;
                align-items: center;
                gap: 10px;
            }

            .header-actions {
                gap: 10px;
            }

            .header-left {
                width: 100%;
                justify-content: center;
            }

            .logo {
                font-size: 20px;
            }

            .court-map {
                display: none;
            }

            .legend {
                justify-content: center;
            }

            .legend-status {
                width: 100%;
                justify-content: flex-end;
                margin-left: 0;
                padding-left: 0;
            }

            .schedule-table th,
            .schedule-table td {
                font-size: 12px;
            }

            .hour-cell {
                width: 50px;
                height: 36px;
            }
        }
    </style>
</head>
<body>
    <!-- Toast 容器 -->
    <div class="toast-container" id="toast-container"></div>

    <div class="container">
        <!-- 头部 -->
        <header class="header">
            <!-- 标题行 -->
            <div class="header-row header-title-row">
                <span class="logo">SMU 羽毛球预约</span>
                <div class="header-right">
                    <div class="header-actions">

        <!-- 主内容 -->

    <!-- 确认弹窗 -->
    <dialog id="confirm-dialog">
        <div class="dialog-header">
            <h3 class="dialog-title" id="dialog-title">确认预约</h3>
        </div>
        <div class="dialog-body">

            <button class="btn btn-primary" id="dialog-ok">确定</button>

    <!-- 登录弹窗 -->
    <dialog id="login-dialog">
        <div class="dialog-header">
            <h3 class="dialog-title">🔐 登录</h3>
        </div>
        <form id="login-form">
            <div class="dialog-body">
                <div class="login-form">
                    <div class="login-field">
                        <label for="login-username">学号</label>
                        <input type="text" id="login-username" class="login-input" autocomplete="username" placeholder="请输入学号">
                    </div>
                    <div class="login-field">
                        <label for="login-password">密码</label>
                        <div class="login-input-wrapper">
                            <input type="password" id="login-password" class="login-input" autocomplete="current-password" placeholder="请输入密码">
                            <button type="button" class="toggle-password" id="togglePwd">显示</button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="dialog-footer">
                <button type="button" class="btn btn-outline" id="login-cancel">取消</button>
                <button type="submit" class="btn btn-primary">登录</button>
            </div>
        </form>
    </dialog>

    <script>
        // ============ 工具函数 ============
        const pad2 = n => n < 10 ? '0' + n : String(n);
        
        // 防抖函数
        function debounce(fn, delay) {
            let timer = null;
            return function(...args) {
                if (timer) clearTimeout(timer);
                timer = setTimeout(() => fn.apply(this, args), delay);
            };
        }

        // ============ Toast 通知系统 ============
        const Toast = {
            container: document.getElementById('toast-container'),
            
            show(type, title, message, duration = 3000) {
                const icons = { success: '✅', error: '❌', info: 'ℹ️' };
                const toast = document.createElement('div');
                toast.className = `toast ${type}`;
                toast.innerHTML = `
                    <span class="toast-icon">${icons[type] || 'ℹ️'}</span>
                    <div class="toast-content">
                        <div class="toast-title">${title}</div>
                        ${message ? `<div class="toast-message">${message}</div>` : ''}
                    </div>
                    <button class="toast-close">×</button>
                `;
                
                toast.querySelector('.toast-close').onclick = () => this.remove(toast);
                this.container.appendChild(toast);
                
                if (duration > 0) {
                    setTimeout(() => this.remove(toast), duration);
                }
                return toast;
            },
            
            remove(toast) {
                toast.style.animation = 'slideOut 0.3s ease forwards';
                setTimeout(() => toast.remove(), 300);
            },
            
            success(title, message) { return this.show('success', title, message); },
            error(title, message) { return this.show('error', title, message); },
            info(title, message) { return this.show('info', title, message); }
        };

        // ============ 主题切换 ============
        const Theme = {
            init() {
                const saved = localStorage.getItem('theme') || 'light';
                this.set(saved);
            },
            
            set(theme) {
                document.documentElement.setAttribute('data-theme', theme);
                localStorage.setItem('theme', theme);
                document.getElementById('themeBtn').textContent = theme === 'dark' ? '☀️' : '🌙';
            },
            
            toggle() {
                const current = document.documentElement.getAttribute('data-theme') || 'light';
                this.set(current === 'dark' ? 'light' : 'dark');
            }
        };

        // ============ 配置 ============
        // 配置将从后端 API 加载
        window.login_url = '';
        window.captcha_url = '';
        window.__auth = null;
        window._configLoaded = false;

        // 从后端加载配置
        async function loadConfig() {
            if (window._configLoaded) return;
            try {
                const resp = await fetch('/api/config');
                const json = await resp.json();
                if (json.ok && json.data) {
                    window.login_url = json.data.login_url || '';
                    window.captcha_url = json.data.captcha_url || '';
                    window._configLoaded = true;
                    console.log('配置加载成功');
                }
            } catch (e) {
                console.error('加载配置失败:', e);
                // 如果API失败，使用默认值（向后兼容）
                window.login_url = window.login_url || 'https://cas.shmtu.edu.cn/cas/login?service=https%3A%2F%2Fwf.shmtu.edu.cn%2Fsso%2Flogin%3Fredirect_uri%3Dhttps%253A%252F%252Fwf.shmtu.edu.cn%252Fsso%252Foauth2%252Fauthorize%253Fclient_id%253DkwxKbMKq3Nafw2mApFZz%2526redirect_uri%253Dhttps%25253A%25252F%25252Fwf.shmtu.edu.cn%25252Fyy-sys%25252Foidc-callback%25253FretUrl%25253Dhttps%25253A%25252F%25252Fwf.shmtu.edu.cn%25252Fyy-sys%25252Fpc%25252Fhome%2526response_type%253Did_token%252520token%2526scope%253Ddata%252520openid%252520process%252520task%252520app%252520submit%252520process_edit%252520start%252520profile%2526state%253D0bfb3977af75474bb82d611a7e4dde78%2526nonce%253Da9c8b134679249aaad587fc2200198a7%26x_client%3Dcas';
                window.captcha_url = window.captcha_url || 'https://cas.shmtu.edu.cn/cas/captcha';
            }
        }

        // ============ 本地存储 ============
        const Auth = {
            save(auth) {
                try { localStorage.setItem('bb_auth', JSON.stringify(auth)); } catch(e) {}
            },
            load() {
                try { 
                    const s = localStorage.getItem('bb_auth'); 
                    return s ? JSON.parse(s) : null; 
                } catch(e) { return null; }
            },
            clear() {
                try { localStorage.removeItem('bb_auth'); } catch(e) {}
            }
        };

        // ============ 状态管理 ============
        const State = {
            isScheduleMode: true,
            pendingCell: null,
            dialogAction: ''
        };

        // ============ 前端缓存管理 ============
        const AvailabilityCache = {
            _cache: new Map(),
            _ttl: 25000, // 25秒本地缓存（服务端30秒）
            
            getKey(date) {
                return `${window.__auth?.username || ''}_${date}`;
            },
            
            get(date) {
                const key = this.getKey(date);
                const entry = this._cache.get(key);
                if (!entry) return null;
                if (Date.now() - entry.ts > this._ttl) {
                    this._cache.delete(key);
                    return null;
                }
                return entry.data;
            },
            
            set(date, data) {
                const key = this.getKey(date);
                this._cache.set(key, { data, ts: Date.now() });
            },
            
            clear() {
                this._cache.clear();
            }
        };

        // ============ 预加载管理 ============
        const Preloader = {
            _pending: new Set(),
            
            async preloadDate(date) {
                if (!window.__auth) return;
                const key = AvailabilityCache.getKey(date);
                if (this._pending.has(key) || AvailabilityCache.get(date)) return;
                
                this._pending.add(key);
                try {
                    const resp = await fetch('/api/availability', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            login_url: window.login_url,
                            captcha_url: window.captcha_url,
                            username: window.__auth.username,
                            password: window.__auth.password,
                            bookdate: date
                        })
                    });
                    const data = await resp.json();
                    if (data.ok) {
                        AvailabilityCache.set(date, data);
                    }
                } catch(e) {
                    console.log('预加载失败:', date, e);
                } finally {
                    this._pending.delete(key);
                }
            },
            
            async preloadAdjacent(currentDate) {
                const current = new Date(currentDate);
                const dates = [];
                // 预加载前后3天
                for (let i = -1; i <= 1; i++) {
                    if (i === 0) continue;
                    const d = new Date(current.getTime() + i * 24 * 60 * 60 * 1000);
                    dates.push(`${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`);
                }
                // 并行预加载
                dates.forEach(date => this.preloadDate(date));
            }
        };

        // ============ DOM 元素 ============
        const Elements = {
            dateInput: document.getElementById('date'),
            modeSwitch: document.getElementById('modeSwitch'),
            tbody: document.getElementById('schedule-tbody'),
            confirmDialog: document.getElementById('confirm-dialog'),
            loginDialog: document.getElementById('login-dialog'),
            dialogTitle: document.getElementById('dialog-title'),
            dialogInfo: document.getElementById('dialog-info'),
            statusText: document.getElementById('status-text'),
            lastUpdate: document.getElementById('last-update'),
            currentUsername: document.getElementById('current-username')
        };

        function renderCurrentUsername() {
            if (!Elements.currentUsername) return;
            Elements.currentUsername.textContent = window.__auth?.username || 'Not logged in';
        }

        // ============ 初始化表格 ============
        function initTable() {
            const tbody = Elements.tbody;
            tbody.innerHTML = '';
            
            for (let i = 1; i <= 15; i++) {
                const tr = document.createElement('tr');
                const paddedIndex = i.toString().padStart(2, '0');
                tr.innerHTML = `<td class="court-label">场地 ${paddedIndex}</td>`;
                
                for (let h = 9; h <= 20; h++) {
                    const td = document.createElement('td');
                    td.className = 'hour-cell';
                    td.dataset.court = i;
                    td.dataset.hour = h;
                    tr.appendChild(td);
                }
                tbody.appendChild(tr);
            }
        }

        // ============ 初始化日期 ============
        function initDate() {
            const today = new Date();
            const sevenDaysLater = new Date(today.getTime() + 7 * 24 * 60 * 60 * 1000);
            Elements.dateInput.value = `${sevenDaysLater.getFullYear()}-${pad2(sevenDaysLater.getMonth() + 1)}-${pad2(sevenDaysLater.getDate())}`;
        }

        // ============ 模块挂载与初始化补充 ============
        // 给外部挂载刷新以便可以被 date change 等事件触发
        window.fetchAndRenderBookings = async function(forceRefresh = false) {
            const date = Elements.dateInput.value;
            if (!window.__auth) return;

            // 先检查前端缓存
            let data = null;
            if (!forceRefresh) {
                data = AvailabilityCache.get(date);
            }
            
            if (data) {
                Elements.statusText.textContent = '从缓存加载...';
            } else {
                Elements.statusText.textContent = '加载中...';
            }
            
            try {
                // 如果没有缓存，从服务器获取
                if (!data) {
                    console.log('发送 availability 请求...');
                    const resp = await fetch('/api/availability', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            login_url: window.login_url,
                            captcha_url: window.captcha_url,
                            username: window.__auth.username,
                            password: window.__auth.password,
                            bookdate: date
                        })
                    });
                    data = await resp.json();
                    console.log('availability 响应:', data);
                    
                    // 存入前端缓存
                    if (data.ok) {
                        AvailabilityCache.set(date, data);
                    }
                } else {
                    console.log('使用前端缓存');
                }

                // 重置所有单元格
                document.querySelectorAll('.hour-cell').forEach(cell => {
                    cell.className = 'hour-cell';
                    cell.style.pointerEvents = '';
                });

                if (!data.ok) {
                    console.warn('availability error', data.error, data);
                    
                    // 登录失败，需要重新输入账号密码
                    if (data.error === 'login_failed') {
                        Elements.statusText.textContent = '登录失败';
                        Toast.error('登录失败', '账号或密码错误，请重新登录');
                        Auth.clear();
                        window.__auth = null;
                        renderCurrentUsername();
                        AvailabilityCache.clear();
                        
                        // 弹出登录框
                        const ok = await promptLogin();
                        if (ok) {
                            return fetchAndRenderBookings(true);
                        }
                    } else {
                        Elements.statusText.textContent = '加载失败: ' + (data.error || '未知错误');
                        Toast.error('加载失败', data.error || '未知错误');
                    }
                    return;
                }

                Elements.statusText.textContent = `已更新 (缓存: ${data.from_cache ? '是' : '否'})`;
                
                const now = new Date();
                Elements.lastUpdate.textContent = `上次更新: ${pad2(now.getHours())}:${pad2(now.getMinutes())}:${pad2(now.getSeconds())}`;

                // 获取本地预约记录
                let others = [];
                try {
                    // forceRefresh 时添加时间戳防止浏览器缓存
                    const cacheBuster = forceRefresh ? `&_t=${Date.now()}` : '';
                    const r = await fetch(`/api/local_bookings?bookdate=${encodeURIComponent(date)}${cacheBuster}`);
                    const j = await r.json();
                    if (j.ok) others = j.data.list || [];
                } catch(e) {}

                const list = data.data?.list || [];
                
                for (const res of list) {
                    const name = res.resources_name || '';
                    const m = name.match(/羽毛球(\d+)号场地/);
                    if (!m) continue;
                    
                    const court = m[1];
                    for (const s of res.slots) {
                        const hour = (s.kssj || '').split(':')[0];
                        const hourInt = parseInt(hour, 10);
                        const cell = document.querySelector(`.hour-cell[data-court='${court}'][data-hour='${hourInt}']`);
                        if (!cell) continue;

                        if (s.bookedByMe) {
                            cell.classList.add('selected');
                        } else if ((s.canAppointmentNumber ?? 0) <= 0) {
                            cell.classList.add('reserved');
                            cell.style.pointerEvents = 'none';
                        } else {
                            const me = window.__auth?.username || '';
                            const myEnd = `${(hourInt + 1).toString().padStart(2, '0')}:00`;
                            const hourStr = `${hourInt.toString().padStart(2, '0')}:00`;
                            const match = others.find(o => 
                                o.resources_name === `羽毛球${court}号场地` && 
                                o.kssj === hourStr && 
                                o.jssj === myEnd
                            );
                            if (match) {
                                if (match.username === me) {
                                    cell.classList.add('selected');
                                } else {
                                    cell.classList.add('others');
                                }
                            }
                        }
                    }
                }

                Elements.statusText.textContent = '已连接';
                Elements.lastUpdate.textContent = `上次更新: ${new Date().toLocaleTimeString()}`;
                
                // 触发预加载相邻日期
                Preloader.preloadAdjacent(date);
                
            } catch (e) {
                console.error('fetch error', e);
                Elements.statusText.textContent = '连接错误';
            }
        }
        
        // 分配到 window 供外部调用
        window.fetchAndRenderBookings = fetchAndRenderBookings;

        // ============ 轮询后台任务 ============
        async function pollJobs() {
            const username = window.__auth?.username;
            const date = Elements.dateInput.value;
            if (!username || !date) return;

            try {
                const resp = await fetch('/api/jobs');
                const j = await resp.json();
                if (!j.ok) return;

                const all = j.data?.db_jobs || [];
                const mine = all.filter(x => x.username === username && x.bookdate === date);
                if (mine.length === 0) return;

                const finished = mine.some(x => 
                    ['done', 'failed', 'cancelled', 'skipped'].includes(String(x.status || '').toLowerCase())
                );
                if (finished) {
                    await fetchAndRenderBookings();
                }
            } catch (e) {}
        }

        // ============ 登录弹窗 ============
        function promptLogin() {
            return new Promise(resolve => {
                const dlg = Elements.loginDialog;
                const form = document.getElementById('login-form');
                const uEl = document.getElementById('login-username');
                const pEl = document.getElementById('login-password');
                const cancelBtn = document.getElementById('login-cancel');
                const togglePwd = document.getElementById('togglePwd');

                togglePwd.onclick = () => {
                    const isPwd = pEl.type === 'password';
                    pEl.type = isPwd ? 'text' : 'password';
                    togglePwd.textContent = isPwd ? '隐藏' : '显示';
                };

                cancelBtn.onclick = () => { dlg.close(); resolve(false); };
                
                form.onsubmit = (e) => {
                    e.preventDefault();
                    const u = (uEl.value || '').trim();
                    const p = (pEl.value || '').trim();
                    if (!u || !p) {
                        Toast.error('登录失败', '请输入学号与密码');
                        return;
                    }
                    window.__auth = { username: u, password: p };
                    Auth.save(window.__auth);
                    renderCurrentUsername();
                    dlg.close();
                    resolve(true);
                };

                // 预填缓存
                const cached = Auth.load();
                if (cached) {
                    uEl.value = cached.username || '';
                    pEl.value = cached.password || '';
                }

                dlg.showModal();
            });
        }

        // ============ 单元格点击处理 ============
        function handleCellClick(cell) {
            if (cell.classList.contains('reserved')) return;

            const date = Elements.dateInput.value;
            const court = cell.dataset.court;
            const hour = cell.dataset.hour;
            const end = (parseInt(hour) + 1).toString().padStart(2, '0');

            State.pendingCell = cell;

            // 判断是否是他人的预约
            if (cell.classList.contains('others')) {
                Toast.warning('无法取消', '这是其他用户的预约任务，您无权取消');
                return;
            }

            if (cell.classList.contains('selected')) {
                // 取消自己的预约
                Elements.dialogTitle.textContent = '❌ 取消预约';
                State.dialogAction = 'cancel';
            } else {
                // 新预约
                Elements.dialogTitle.textContent = State.isScheduleMode ? '⏰ 定时抢票' : '✅ 确认预约';
                State.dialogAction = 'book';
            }

            Elements.dialogInfo.innerHTML = `
                <div class="dialog-info-item">
                    <span class="dialog-info-label">日期</span>
                    <span class="dialog-info-value">${date}</span>
                </div>
                <div class="dialog-info-item">
                    <span class="dialog-info-label">场地</span>
                    <span class="dialog-info-value">羽毛球 ${court} 号场地</span>
                </div>
                <div class="dialog-info-item">
                    <span class="dialog-info-label">时间</span>
                    <span class="dialog-info-value">${hour}:00 - ${end}:00</span>
                </div>
                ${State.dialogAction === 'book' && State.isScheduleMode ? `
                <div class="dialog-info-item">
                    <span class="dialog-info-label">模式</span>
                    <span class="dialog-info-value" style="color: var(--primary)">21:00 自动抢票</span>
                </div>
                ` : ''}
            `;

            Elements.confirmDialog.showModal();
        }

        // ============ 确认/取消操作 ============
        async function handleDialogConfirm() {
            const cell = State.pendingCell;
            if (!cell) return;

            const date = Elements.dateInput.value;
            const court = cell.dataset.court;
            const hour = cell.dataset.hour;
            const end = (parseInt(hour) + 1).toString().padStart(2, '0');

            Elements.confirmDialog.close();

            if (State.dialogAction === 'book') {
                try {
                    const username = window.__auth?.username;
                    const password = window.__auth?.password;
                    if (!username || !password) {
                        Toast.error('未登录', '请先登录');
                        return;
                    }

                    let resp;
                    if (State.isScheduleMode) {
                        resp = await fetch('/api/book/schedule', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                login_url: window.login_url,
                                captcha_url: window.captcha_url,
                                username, password,
                                bookdate: date,
                                kssj: `${hour}:00`,
                                jssj: `${end}:00`,
                                resources_name: `羽毛球${court}号场地`,
                                target_time_str: '21:00:00',
                                num_threads: 5,
                                run_async: true
                            })
                        });
                    } else {
                        resp = await fetch('/api/book', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                login_url: window.login_url,
                                captcha_url: window.captcha_url,
                                username, password,
                                bookdate: date,
                                kssj: `${hour}:00`,
                                jssj: `${end}:00`,
                                resources_name: `羽毛球${court}号场地`
                            })
                        });
                    }

                    const data = await resp.json();
                    if (data.ok) {
                        cell.classList.add('selected');
                        Toast.success('预约成功', State.isScheduleMode ? '已加入21:00抢票队列' : '预约请求已提交');
                    } else {
                        // 资源已被其他用户预约
                        if (data.error === 'resource_already_booked') {
                            Toast.error('预约失败', '该时间段已被其他用户预约');
                            await fetchAndRenderBookings(true);
                            return;
                        }
                        // 登录失败，需要重新登录
                        if (data.error === 'login_failed') {
                            Toast.error('登录失败', '账号或密码错误，请重新登录');
                            Auth.clear();
                            window.__auth = null;
                            renderCurrentUsername();
                            AvailabilityCache.clear();
                            const ok = await promptLogin();
                            if (ok) {
                                await fetchAndRenderBookings(true);
                            }
                            return;
                        }
                        Toast.error('预约失败', data.error || '未知错误');
                    }
                } catch (e) {
                    Toast.error('请求异常', e.message);
                }
            } else if (State.dialogAction === 'cancel') {
                try {
                    const username = window.__auth?.username;
                    if (username) {
                        const resp = await fetch('/api/jobs/stop_by_params', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                username,
                                bookdate: date,
                                kssj: `${hour}:00`,
                                jssj: `${end}:00`,
                                resources_name: `羽毛球${court}号场地`,
                                current_username: username
                            })
                        });
                        const data = await resp.json();
                        if (!data.ok) {
                            Toast.error('取消失败', data.data?.message || '无权取消此任务');
                            return;
                        }
                    }
                    // 先移除样式，立即给用户反馈
                    cell.classList.remove('selected', 'others');
                    Toast.success('已取消', '预约已取消');
                    // 强制刷新数据，跳过缓存
                    await fetchAndRenderBookings(true);
                } catch (e) {
                    Toast.error('取消失败', e.message);
                }
            }

            State.pendingCell = null;
        }

        // ============ 事件绑定 ============
        function bindEvents() {
            // 主题切换
            document.getElementById('themeBtn').addEventListener('click', () => Theme.toggle());

            // 模式切换
            Elements.modeSwitch.addEventListener('click', () => {
                State.isScheduleMode = !State.isScheduleMode;
                Elements.modeSwitch.classList.toggle('active', State.isScheduleMode);
                Toast.info('模式切换', State.isScheduleMode ? '已切换为21:00抢票模式' : '已切换为直接预约模式');
            });

            // 日期变化
            Elements.dateInput.addEventListener('change', debounce(async () => {
                await fetchAndRenderBookings();
                Toast.info('数据已更新', '');
            }, 300));

            // 刷新按钮 - 强制刷新，跳过缓存
            document.getElementById('refreshBtn').addEventListener('click', async () => {
                await fetchAndRenderBookings(true);
                Toast.success('刷新成功', '');
            });

            // 退出登录
            document.getElementById('logoutBtn').addEventListener('click', async () => {
                const username = window.__auth?.username;
                
                // 清除服务端 token 缓存
                if (username) {
                    try {
                        await fetch('/api/logout', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ username })
                        });
                    } catch(e) {
                        console.warn('logout api failed', e);
                    }
                }
                
                // 清除前端缓存
                Auth.clear();
                window.__auth = null;
                renderCurrentUsername();
                AvailabilityCache.clear();
                document.querySelectorAll('.hour-cell').forEach(cell => {
                    cell.className = 'hour-cell';
                });
                Elements.statusText.textContent = '未登录';
                Toast.info('已退出登录', '');
                const ok = await promptLogin();
                if (ok) {
                    await fetchAndRenderBookings(true);
                    Toast.success('登录成功', '');
                }
            });

            // 表格点击 (事件委托)
            Elements.tbody.addEventListener('click', (e) => {
                const cell = e.target.closest('.hour-cell');
                if (cell) handleCellClick(cell);
            });

            // 弹窗按钮
            document.getElementById('dialog-cancel').addEventListener('click', () => {
                Elements.confirmDialog.close();
                State.pendingCell = null;
            });
            document.getElementById('dialog-ok').addEventListener('click', handleDialogConfirm);

            // ESC 关闭弹窗
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    Elements.confirmDialog.close();
                    State.pendingCell = null;
                }
            });
        }

        // ============ 初始化 ============
        async function init() {
            Theme.init();
            initTable();
            initDate();
            bindEvents();

            // 先加载配置
            await loadConfig();

            // 尝试使用缓存登录
            const cached = Auth.load();
            if (cached && cached.username && cached.password) {
                window.__auth = cached;
            } else {
                const ok = await promptLogin();
                if (!ok) {
                    Toast.error('未登录', '无法加载数据');
                    return;
                }
            }

            renderCurrentUsername();
            await fetchAndRenderBookings();
            Toast.success('加载完成', '数据已更新');

            // 定时刷新
            setInterval(async () => {
                if (window.__auth) await fetchAndRenderBookings();
            }, 60000);

            // 轮询任务状态（10秒）
            setInterval(pollJobs, 10000);
        }

        // 启动
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
